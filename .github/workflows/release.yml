name: Release

# Publishing a release is a maintainer action: push a tag "vX.Y.Z" matching <Version> in Directory.Build.props, with a
# "## [X.Y.Z]" section in CHANGELOG.md. This builds the portable zip, attests its build provenance, and creates the
# GitHub release that the app's in-app updates read. Only people with write access can push tags.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The tag reaches scripts through an environment variable, never interpolated into the script text.
      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag $env:TAG is not vX.Y.Z." }
          $version = (dotnet msbuild src/PriceRunnerPanel/PriceRunnerPanel.csproj -getProperty:Version).Trim()
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG doesn't match Version $version in Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: pwsh scripts/release-notes.ps1 -Version $env:VERSION > release-notes.md

      - name: Build and package
        shell: pwsh
        run: pwsh scripts/publish-windows.ps1

      # Lets anyone check the zip was built by this workflow from this repository:
      #   gh attestation verify PriceRunnerPanel-X.Y.Z-win-x64.zip --repo PantaKoda/PriceRunnerPanel
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/PriceRunnerPanel-*-win-x64.zip

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG `
            "artifacts/release/PriceRunnerPanel-$env:VERSION-win-x64.zip" `
            "artifacts/release/PriceRunnerPanel-$env:VERSION-win-x64.zip.sha256" `
            --title "PriceRunner Panel $env:VERSION" --notes-file release-notes.md --verify-tag
