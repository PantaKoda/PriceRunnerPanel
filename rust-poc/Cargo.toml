[package]
name = "pricerunner-panel"
version = "0.4.7"
edition = "2021"
description = "PriceRunner Panel, Rust proof of concept"
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
tray-icon = "0.26"
ureq = { version = "3", features = ["gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
sha2 = "0.10"
winreg = "0.56"
open = "5"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
